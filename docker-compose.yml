services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maia
      POSTGRES_PASSWORD: maia
      POSTGRES_DB: maia
    volumes:
      - maia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maia -d maia"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://maia:maia@postgres:5432/maia
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_DISCORD_CLIENT_ID: ${NEXT_PUBLIC_DISCORD_CLIENT_ID}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    environment:
      DATABASE_URL: postgresql://maia:maia@postgres:5432/maia
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_DEV_GUILD_ID: ${DISCORD_DEV_GUILD_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  maia_pg:
